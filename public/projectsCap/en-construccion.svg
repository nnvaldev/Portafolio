<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" fill="none" role="img" aria-label="Proyecto en construcción">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A192F"/>
      <stop offset="1" stop-color="#112240"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#64ffda"/>
      <stop offset="1" stop-color="#00d4aa"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#64ffda" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <pattern id="stripes" width="44" height="44" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="44" height="44" fill="#0A192F"/>
      <rect width="22" height="44" fill="#64ffda" fill-opacity="0.85"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop stop-color="#64ffda" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#64ffda" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fondo -->
  <rect width="800" height="480" fill="url(#bg)"/>
  <rect width="800" height="480" fill="url(#grid)"/>
  <rect width="800" height="480" fill="url(#glow)"/>

  <!-- Casco de obra -->
  <g transform="translate(400 150)">
    <rect x="-7" y="-34" width="14" height="24" rx="6" fill="url(#accent)"/>
    <path d="M-52 10 a52 48 0 0 1 104 0 z" fill="url(#accent)"/>
    <rect x="-74" y="6" width="148" height="17" rx="8.5" fill="url(#accent)"/>
  </g>

  <!-- Barra de peligro a rayas -->
  <rect x="170" y="200" width="460" height="50" rx="12" fill="url(#stripes)"/>
  <rect x="170" y="200" width="460" height="50" rx="12" fill="none" stroke="#64ffda" stroke-opacity="0.35"/>

  <!-- Texto -->
  <text x="400" y="318" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="40" font-weight="700" letter-spacing="2" fill="#e2f6f0">EN CONSTRUCCIÓN</text>
  <text x="400" y="356" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" letter-spacing="3" fill="#64ffda">AgendaPro · Próximamente</text>
</svg>
